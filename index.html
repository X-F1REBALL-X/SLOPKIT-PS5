<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLOPKIT // LOS SANTOS</title>
<link rel="preload" href="slopkit/gta-logo.jpg" as="image">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Bebas+Neue&display=swap');

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: 
      radial-gradient(ellipse at 50% 0%, #1a1a1a 0%, #0a0a0a 60%, #000 100%);
    color: #e8e8e8;
    font-family: 'Oswald', 'Impact', system-ui, sans-serif;
    overflow: hidden;
  }

  /* subtle noise / grit overlay */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1;
  }

  #wrap {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px;
    position: relative;
    z-index: 2;
  }

  #logo {
    box-sizing: border-box;
    width: 280px; max-width: 70vw;
    height: auto;
    border: 3px solid #ffcc00;
    box-shadow: 
      0 0 0 1px #000,
      0 20px 50px rgba(0,0,0,.8),
      0 0 40px rgba(255,204,0,.15);
    filter: contrast(1.05);
  }

  #actions {
    display: flex; flex-direction: column; gap: 16px;
    align-items: center; justify-content: center;
  }

  .action {
    box-sizing: border-box;
    display: inline-block;
    min-width: 220px;
    padding: 18px 36px;
    border: 3px solid #ffcc00;
    border-radius: 2px;
    color: #000;
    background: #ffcc00;
    font-family: 'Oswald', Impact, sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    transition: all .15s ease;
    box-shadow: 
      0 6px 0 #b38f00,
      0 12px 24px rgba(0,0,0,.5);
  }

  .action:hover, .action:focus {
    outline: none;
    background: #ffe066;
    border-color: #fff;
    transform: translateY(-2px);
    box-shadow: 
      0 8px 0 #b38f00,
      0 16px 30px rgba(0,0,0,.55),
      0 0 20px rgba(255,204,0,.35);
  }

  .action:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #b38f00, 0 4px 12px rgba(0,0,0,.4);
  }

  #tag {
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #ffcc00;
    opacity: 0.85;
    margin-top: -8px;
  }

  #status { 
    min-height: 1.5em; 
    color: #888; 
    font-size: 16px;
    font-family: monospace;
  }

  @media (max-width: 650px) {
    #actions { width: 82vw; }
    .action { width: 100%; }
    #logo { width: 220px; }
  }
</style>
</head>
<body>

<div id="wrap">
  <img id="logo" src="slopkit/gta-logo.jpg" alt="SLOPKIT">
  <div id="tag">LOS SANTOS // PS5</div>
  <div id="actions">
    <a id="start" class="action"
       href="slopkit/poops.html?go=1&amp;auto=1&amp;trigger=netcontrol&amp;payload=1&amp;v=17"
       tabindex="0">START MISSION</a>
  </div>
  <div id="status"></div>
</div>

<script>try {
    var q = new URLSearchParams(location.search);
    var start = document.getElementById("start");
    start.focus();
} catch (e) {}

try {
    document.getElementById("logo").addEventListener("error", function () {
        this.style.display = "none";
    });
} catch (e) {}
</script>

</body>
</html>
