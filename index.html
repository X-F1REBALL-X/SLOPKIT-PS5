<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLOPKIT</title>
<link rel="preload" href="slopkit/ps-logo.jpg" as="image">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: #2a9fff;
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
    overflow-x: hidden;
  }
  #bg {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    z-index: 0;
    background: #000 url("slopkit/ps-logo.jpg") center center no-repeat;
    background-size: cover;
    pointer-events: none;
  }
  #bg:after {
    content: "";
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    background: rgba(0,0,0,0.62);
    pointer-events: none;
  }
  #wrap, #foot {
    position: relative;
    z-index: 2;
  }
  #wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 28px 20px 80px;
    text-align: center;
    box-sizing: border-box;
  }
  #brand-title {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #2a9fff;
    text-shadow: 0 0 18px rgba(42,159,255,0.45);
  }
  #brand-sub {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: #ffffff;
    text-shadow: 0 0 10px rgba(255,255,255,0.35);
  }
  #logo {
    display: none;
  }
  #start {
    display: inline-block;
    margin: 10px auto 0;
    padding: 16px 28px;
    min-width: 220px;
    border: 2px solid #2a9fff;
    border-radius: 6px;
    background: rgba(0,40,80,0.65);
    color: #2a9fff;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-decoration: none;
    cursor: pointer;
    text-shadow: 0 0 12px rgba(42,159,255,0.45);
    box-shadow: 0 0 24px rgba(42,159,255,0.25);
  }
  #status {
    min-height: 1.2em;
    color: #5eb6ff;
    font-size: 13px;
  }
  #foot {
    position: fixed;
    left: 0; right: 0; bottom: 10px;
    text-align: center;
    font-size: 12px;
    color: #2a9fff;
    letter-spacing: 0.08em;
    pointer-events: none;
    line-height: 1.5;
    text-shadow: 0 0 12px rgba(42,159,255,0.35);
  }
  #foot b { color: #2a9fff; font-weight: 600; }
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="wrap">
  <p id="brand-title">SLOPKIT</p>
  <p id="brand-sub">PS5 toolkit</p>
  <img id="logo" src="slopkit/ps-logo.jpg" alt="">
  <a id="start"
     href="slopkit/poops.html?go=1&amp;auto=1&amp;trigger=netcontrol&amp;payload=1&amp;v=17"
     tabindex="0">Press X to start</a>
  <div id="status"></div>
</div>
<div id="foot"><b>Created by X-F1REBALL-X</b></div>
<script>
try {
  var start = document.getElementById("start");
  if (start) start.focus();
} catch (e) {}
</script>
</body>
</html>
